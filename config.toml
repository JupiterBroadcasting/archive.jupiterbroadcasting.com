# Output formats

[mediaTypes]
  # markdown twins of pages, for llms.txt consumers (see llmstxt.org spec v2)
  [mediaTypes."text/markdown"]
    suffixes = ["md"]
  [mediaTypes."text/plain"]
    suffixes = ["txt"]

[outputFormats]
  [outputFormats.webplayer]
  mediatype ="application/json"
  baseName = "webplayer"

  # Every page/section also emitted as markdown: /show/x/0650/ -> /show/x/0650/index.md
  [outputFormats.markdown]
    mediaType = "text/markdown"
    isPlainText = true
    baseName = "index"

  # llmstxt.org spec files (see https://llmstxt.org). Rendered by Hugo from
  # layouts/index.llms.txt / show/list.llms.txt -- enabled on home below, and
  # on individual show sections via `outputs` in their _index.md front matter
  # (so they do NOT render for /show/, /hosts/, /guests/, etc).
  [outputFormats.llms]
    mediaType = "text/plain"
    isPlainText = true
    baseName = "llms"

  # /llms-full.txt: core (non-episode) pages concatenated
  [outputFormats.llmsfull]
    mediaType = "text/plain"
    isPlainText = true
    baseName = "llms-full"

  # /show/<slug>/episodes.json: full episode enumeration per show
  # (Hugo 0.105 predates per-section sitemaps, so this is the machine list)
  [outputFormats.episodes]
    mediaType = "application/json"
    isPlainText = true
    baseName = "episodes"

[outputs]
  home = ["html", "rss", "llms", "llmsfull"]
  page = ["html", "markdown"]
  # page = ["json","html","webplayer"]
  # section = ["html","rss"]
  section = ["html", "markdown"]
  taxonomy = ["html", "markdown"]
  term = ["html", "markdown"]
