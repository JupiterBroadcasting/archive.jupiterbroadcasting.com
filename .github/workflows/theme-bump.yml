# Pins the newest `develop` commit of jb-hugo-theme in go.mod and opens (or updates) a PR into `develop`.
# Production only gets it with the next normal develop -> main release PR.
#
# Triggers: the theme repo's notify-sites workflow (repository_dispatch), an hourly fallback, or by hand.
# Token: PRs opened with the default GITHUB_TOKEN don't start other workflows (so no e2e run on the PR) and need the
#   org/repo setting "Allow GitHub Actions to create and approve pull requests". Set a THEME_BUMP_TOKEN secret
#   (fine-grained PAT or GitHub App token: contents + pull-requests write on this repo) to avoid both.
name: Bump jb-hugo-theme and people

on:
  repository_dispatch:
    types: [theme-updated]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: theme-bump
  cancel-in-progress: false

env:
  THEME_MODULE: github.com/goodwinlabs/jb-hugo-theme
  HUGO_IMAGE: ghcr.io/gohugoio/hugo:v0.169.0
  BRANCH: bot/theme-bump

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          token: ${{ secrets.THEME_BUMP_TOKEN || github.token }}

      - name: Pin newest theme develop
        id: pin
        run: |
          hugo() { docker run --rm -u "$(id -u):$(id -g)" -v "$PWD":/src -w /src -e HOME=/tmp -e HUGO_CACHEDIR=/tmp/hugo_cache --entrypoint hugo "$HUGO_IMAGE" "$@"; }
          hugo mod get "${THEME_MODULE}@develop"
          hugo mod tidy
          if git diff --quiet -- go.mod go.sum; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Theme pin already current"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "summary<<EOF"
              git diff -U0 go.mod | grep -E '^[-+]\s' | sed 's/^/    /'
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Build the site with the new theme
        if: steps.pin.outputs.changed == 'true'
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD":/src -w /src -e HOME=/tmp -e HUGO_CACHEDIR=/tmp/hugo_cache \
            --entrypoint hugo "$HUGO_IMAGE" --gc --quiet -d /tmp/public

      - name: Open or update the bump PR
        if: steps.pin.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.THEME_BUMP_TOKEN || github.token }}
          SUMMARY: ${{ steps.pin.outputs.summary }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git commit -qam "Bump jb-hugo-theme / people modules"
          # an open bump branch with the same pins needs no new push (a push restarts its checks)
          if git fetch -q origin "$BRANCH" 2>/dev/null && git diff --quiet FETCH_HEAD -- go.mod go.sum; then
            echo "$BRANCH already has these pins"
          else
            git push -f origin "$BRANCH"
          fi
          body="Updates module pins in \`go.mod\`:

          ${SUMMARY}

          Opened by \`.github/workflows/theme-bump.yml\`. The site built with this theme before the PR was opened; check the Render preview, then merge. Production gets it with the next develop → main release PR."
          if [ -n "$(gh pr list --head "$BRANCH" --base develop --state open --json number --jq '.[].number')" ]; then
            gh pr edit "$BRANCH" --body "$body"
          else
            if ! out=$(gh pr create --base develop --head "$BRANCH" --title "Bump jb-hugo-theme / people modules" --body "$body" 2>&1); then
              echo "$out"
              # Org/repo setting blocks GITHUB_TOKEN from opening PRs: keep the pushed branch, warn with a one-click link
              if grep -q "not permitted to create" <<<"$out"; then
                echo "::warning title=Bump branch pushed; PR not opened::GitHub Actions may not open PRs in this repo and THEME_BUMP_TOKEN is not set. Open it: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/develop...${BRANCH}?expand=1"
                exit 0
              fi
              exit 1
            fi
            echo "$out"
          fi
          # --auto merges at once when develop requires no checks, so only use it once e2e is a required check there
          if gh api "repos/${GITHUB_REPOSITORY}/branches/develop/protection/required_status_checks" >/dev/null 2>&1; then
            gh pr merge "$BRANCH" --auto --squash || echo "Auto-merge unavailable (enable 'Allow auto-merge' in repo settings)"
          else
            echo "::notice::develop has no required checks; merge the bump PR after e2e passes"
          fi
