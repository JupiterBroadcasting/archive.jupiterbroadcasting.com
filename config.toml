baseURL = 'https://archive.jupiterbroadcasting.com/'
locale = 'en-us'
title = 'Jupiter Broadcasting Archive'

[pagination]
  pagerSize = 12

[module]
  # Shared theme (layouts, assets, fonts, favicons, logos)
  [[module.imports]]
    path = "github.com/goodwinlabs/jb-hugo-theme"

[params]
  description = "The archive of retired Jupiter Broadcasting shows: Linux Action Show, TechSNAP, BSD Now, Coder Radio, Unfilter and more."
  keywords = "Jupiter Broadcasting, archive, Linux Action Show, TechSNAP, BSD Now, Coder Radio, Unfilter, Linux Action News, Self-Hosted, podcast"
  github_repo = "https://github.com/goodwinlabs/archive.jupiterbroadcasting.com"
  # The archive has no membership page; Support goes to the main site
  support_url = "https://www.jupiterbroadcasting.com/membership/"
  # Home slider and /show/ list retired shows
  shows_active = false
  home_subtitle = "The archive of retired Jupiter Broadcasting shows. Current shows live at jupiterbroadcasting.com."

[params.footer.logo]
  image = "/images/logo_no_rocket.svg"
  text = "Jupiter Broadcasting"
  url = "https://www.jupiterbroadcasting.com/"
[params.footer.left]
  headline = "Get Social"
[params.footer.center]
  headline = ""
[params.footer.right]
  headline = "Get Involved"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[taxonomies]
  tag = "tags"
  category = "categories"
  host = "hosts"
  guest = "guests"

